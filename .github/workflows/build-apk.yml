name: Build Android Demo APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android Project
        run: npx cap sync android

      - name: Build Debug APK with Gradle
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK Asset
        run: |
          mkdir -p release-output
          cp android/app/build/outputs/apk/debug/app-debug.apk release-output/RestoFlow-Demo.apk
          ls -lh release-output/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RestoFlow-Demo-APK
          path: release-output/RestoFlow-Demo.apk
          retention-days: 30

      - name: Publish or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v1.0.0-demo release-output/RestoFlow-Demo.apk \
            --title "RestoFlow ONE • Android Demo APK (Pitch Package)" \
            --notes "### 🍽️ RestoFlow ONE — Standalone Android Demo APK

          Built for demonstrating the RestoFlow ecosystem to restaurant owners and stakeholders.

          #### 📱 Installation Instructions:
          1. Download **\`RestoFlow-Demo.apk\`** on your Android device.
          2. Open the file and tap **Install** (enable *Install Unknown Apps* if prompted).
          3. Launch the app and test the 3 interfaces:
             - **👑 Restaurant Owner Dashboard** (sales ticker, table occupancy, menu editor)
             - **👨‍🍳 Kitchen Display System (KDS)** (live chef tickets, audio alerts)
             - **📱 Customer Dine-In Menu** (QR table ordering, bill splitting, waiter call)

          #### 🌐 Live Browser Demo:
          https://uniqabhishek.github.io/smart-restaurant-qr/" \
            --clobber
